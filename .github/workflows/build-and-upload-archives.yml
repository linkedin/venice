name: Build and Upload Archives On Workflow Call

# Run this workflow on workflow_call
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

jobs:
  build:
    # Name the Job
    name: Build tagged commit and upload an archive
    # Set the type of machine to run on
    runs-on: ubuntu-latest
    # Only run for upstream main
    if: github.repository == 'linkedin/venice'
    steps:
      # Checks out a copy of your repository on the ubuntu-latest machine
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0 # all history for all branches and tags

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '11'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Upload archive
        env:
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_API_KEY: ${{ secrets.JFROG_API_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./gradlew "-Pversion=$RELEASE_TAG" publishAllPublicationsToLinkedInJFrogRepository
